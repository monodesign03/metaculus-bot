name: Keep scheduled workflows alive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable the forecasting workflow and this one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in run_bot_on_tournament.yaml keepalive.yaml; do
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
          done
